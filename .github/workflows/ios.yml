name: iOS build

# Builds Sapient for iPhone/iPad on a macOS runner. Without signing secrets the result is an
# UNSIGNED .ipa, to be signed and installed with your own Apple ID (e.g. Sideloadly). Once Apple
# Developer Program secrets are added, this job is the place to add signing + TestFlight upload.
on:
  workflow_dispatch:
  push:
    branches: [ios]
    tags: ["ios-v*"]

# The Reown (WalletConnect) project ID is baked into the web bundle by Vite. Locally it comes from
# .env.local (git-ignored); here from the repository secret of the same name. Without it the app
# builds fine but WalletConnect pairing reports "not configured".
env:
  VITE_REOWN_PROJECT_ID: ${{ secrets.VITE_REOWN_PROJECT_ID }}

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and unit tests
        run: pnpm run typecheck && pnpm run test

      - name: Build the mobile web app and sync it into the Xcode project
        # cap sync also runs `pod install` (ML Kit QR scanner, Capacitor plugins).
        run: pnpm run build:mobile && npx cap sync ios

      - name: Archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sapient.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -50; tail -150 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Package the .ipa
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out/Payload
          cp -R "$RUNNER_TEMP/Sapient.xcarchive/Products/Applications/App.app" out/Payload/
          (cd out && zip -qry "Sapient-$VERSION-unsigned.ipa" Payload && rm -rf Payload && shasum -a 256 *.ipa > SHA256SUMS)
          cat out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: sapient-ios-unsigned
          path: out/
          retention-days: 30

  simulator:
    # Simulator build (no signing needed, arm64 + x86_64) for Appetize.io or a local simulator,
    # plus a launch smoke test with screenshots.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the mobile web app and sync it into the Xcode project (no QR scanner)
        # ML Kit has no arm64-simulator slice, and a simulator has no camera: drop the scanner's
        # native pod from this build only (Scan then reports it unavailable; paste still works).
        run: |
          pnpm run build:mobile
          node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));delete p.dependencies['@capacitor-mlkit/barcode-scanning'];require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          npx cap sync ios
          ! grep -q MlkitBarcode ios/App/Podfile

      - name: Build for the simulator
        working-directory: ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild-sim.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/xcodebuild-sim.log" | head -50; tail -150 "$RUNNER_TEMP/xcodebuild-sim.log"; exit 1; }

      - name: Package for Appetize
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p sim
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/App.app"
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/sim/Sapient-$VERSION-simulator.zip" App.app)
          echo "APP=$APP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sapient-ios-simulator
          path: sim/
          retention-days: 30

      - name: Build the screenshot-tour variant
        # Same app plus src/mobile/e2e.ts, which walks a throwaway wallet through the main screens and
        # asks scripts/ios-e2e-server.mjs for a screenshot at each stop. The Appetize zip above is
        # built without it. CSP and ATS are opened to the local server in this variant only.
        run: |
          VITE_E2E_SHOTS=http://127.0.0.1:8765 npx vite build -c vite.mobile.config.ts
          sed -i '' "s#connect-src 'self'#connect-src 'self' http://127.0.0.1:8765#" dist-mobile/index.html
          grep -q "127.0.0.1:8765" dist-mobile/index.html
          npx cap copy ios
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $PL
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" $PL
          cd ios/App && xcodebuild build -workspace App.xcworkspace -scheme App -configuration Release             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd"             ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcodebuild-tour.log" 2>&1             || { grep -E "error:" "$RUNNER_TEMP/xcodebuild-tour.log" | head -50; exit 1; }

      - name: Screenshot tour
        timeout-minutes: 20
        continue-on-error: true
        run: |
          mkdir -p shots
          for MODEL in "iPhone 16" "iPad Air 11-inch (M2)"; do
            UDID=$(xcrun simctl list devices available -j | node -e '
              const d=JSON.parse(require("fs").readFileSync(0)).devices;const want=process.argv[1];
              for (const [rt,list] of Object.entries(d)) if (rt.includes("iOS")) for (const x of list) if (x.name===want) { console.log(x.udid); process.exit(0); }' "$MODEL" || true)
            if [ -z "$UDID" ]; then echo "no simulator named $MODEL"; continue; fi
            SLUG=$(echo "$MODEL" | tr -cd '[:alnum:]')
            echo "::group::$MODEL"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl install "$UDID" "$APP"
            UDID=$UDID PREFIX=$SLUG OUT=shots node scripts/ios-e2e-server.mjs &
            SPID=$!
            sleep 1
            xcrun simctl launch "$UDID" mw.tari.sapient
            # The server exits when the tour reports /done; give up after 8 minutes.
            for i in $(seq 1 480); do kill -0 $SPID 2>/dev/null || break; sleep 1; done
            kill $SPID 2>/dev/null || true
            xcrun simctl terminate "$UDID" mw.tari.sapient || true
            xcrun simctl shutdown "$UDID" || true
            echo "::endgroup::"
          done
          ls shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sapient-ios-screenshots
          path: shots/
          retention-days: 14
