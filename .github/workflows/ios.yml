name: iOS build

# Builds Sapient for iPhone/iPad on a macOS runner. Without signing secrets the result is an
# UNSIGNED .ipa, to be signed and installed with your own Apple ID (e.g. Sideloadly). Once Apple
# Developer Program secrets are added, this job is the place to add signing + TestFlight upload.
on:
  workflow_dispatch:
  push:
    branches: [ios]
    tags: ["ios-v*"]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and unit tests
        run: pnpm run typecheck && pnpm run test

      - name: Build the mobile web app and sync it into the Xcode project
        # cap sync also runs `pod install` (ML Kit QR scanner, Capacitor plugins).
        run: pnpm run build:mobile && npx cap sync ios

      - name: Archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sapient.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -50; tail -150 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Package the .ipa
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out/Payload
          cp -R "$RUNNER_TEMP/Sapient.xcarchive/Products/Applications/App.app" out/Payload/
          (cd out && zip -qry "Sapient-$VERSION-unsigned.ipa" Payload && rm -rf Payload && shasum -a 256 *.ipa > SHA256SUMS)
          cat out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: sapient-ios-unsigned
          path: out/
          retention-days: 30

  simulator:
    # Simulator build (no signing needed) for Appetize.io or a local simulator, plus a launch
    # smoke test with screenshots. ML Kit ships no arm64-simulator slice, so this is x86_64
    # (runs under Rosetta on Apple-silicon simulators).
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the mobile web app and sync it into the Xcode project
        run: pnpm run build:mobile && npx cap sync ios

      - name: Build for the simulator
        working-directory: ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild-sim.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/xcodebuild-sim.log" | head -50; tail -150 "$RUNNER_TEMP/xcodebuild-sim.log"; exit 1; }

      - name: Package for Appetize
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p sim
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/App.app"
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/sim/Sapient-$VERSION-simulator.zip" App.app)
          echo "APP=$APP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sapient-ios-simulator
          path: sim/
          retention-days: 30

      - name: Launch smoke test (screenshots)
        timeout-minutes: 12
        continue-on-error: true
        run: |
          mkdir -p shots
          for MODEL in "iPhone 16" "iPad Air 11-inch (M2)"; do
            UDID=$(xcrun simctl list devices available -j | node -e '
              const d=JSON.parse(require("fs").readFileSync(0)).devices;const want=process.argv[1];
              for (const [rt,list] of Object.entries(d)) if (rt.includes("iOS")) for (const x of list) if (x.name===want) { console.log(x.udid); process.exit(0); }' "$MODEL" || true)
            if [ -z "$UDID" ]; then echo "no simulator named $MODEL"; continue; fi
            SLUG=$(echo "$MODEL" | tr -cd '[:alnum:]')
            xcrun simctl boot "$UDID" || true
            echo "== $MODEL"
            date; xcrun simctl bootstatus "$UDID" -b > /dev/null; date
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch --terminate-running-process "$UDID" mw.tari.sapient &
            LPID=$!
            sleep 25
            xcrun simctl io "$UDID" screenshot "shots/$SLUG-launch.png"
            # Still running? (a crash would leave nothing to list)
            xcrun simctl spawn "$UDID" launchctl list | grep -i sapient || echo "WARNING: app not running on $MODEL"
            kill $LPID 2>/dev/null || true
            xcrun simctl shutdown "$UDID" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sapient-ios-screenshots
          path: shots/
          retention-days: 14
