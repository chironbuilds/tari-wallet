<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Popup preview harness</title>
<style>
  html, body { margin: 0; background: #0d0e12; }
  #frame-wrap { display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; font-family: sans-serif; }
  .frame-box { background: #000; padding: 0; border-radius: 8px; overflow: hidden; }
  .frame-label { color: #ccc; font-size: 12px; margin-bottom: 6px; font-family: sans-serif; }
  iframe { width: 320px; height: 560px; border: 1px solid #333; }
</style>
</head>
<body>
<div id="frame-wrap"></div>
<script>
  // Renders several instances of the real popup UI (popup.html + main.ts, completely
  // unmodified) inside iframes, each pre-seeded with a different mock wallet state via
  // localStorage (read by the mock chrome.* shim each iframe injects before main.ts runs).
  // This exists purely to visually preview the popup in a normal browser tab, since Chrome
  // extension popups can't be screenshotted directly without a real "Load unpacked" +
  // clicking the toolbar icon, which browser automation can't drive (chrome://extensions and
  // native file pickers are both outside the automatable DOM).
  const scenarios = [
    "onboarding",
    "unlock",
    "forgot-password",
    "home",
    "send",
    "settings",
    "approval-connect",
    "approval-transaction",
    "token-detail",
    "shield",
    "unshield",
    "send-privately",
  ];
  const wrap = document.getElementById("frame-wrap");
  for (const s of scenarios) {
    const box = document.createElement("div");
    box.className = "frame-box";
    const label = document.createElement("div");
    label.className = "frame-label";
    label.textContent = s;
    const iframe = document.createElement("iframe");
    iframe.src = `popup-preview-frame.html?scenario=${s}`;
    wrap.appendChild(label);
    wrap.appendChild(box);
    box.appendChild(iframe);
  }
</script>
</body>
</html>
