# pnpm blocks every dependency's install-time (preinstall/install/postinstall) scripts by
# default -- the single most common real-world npm supply-chain attack vector, since a
# compromised package's postinstall script runs with full filesystem/network access at install
# time, no different from running arbitrary code. Everything not listed here stays blocked.
#
# Only two dependencies in this project legitimately need one, both to download the correct
# platform-specific native binary for a well-known build tool (verified by inspecting every
# installed package's own package.json for a preinstall/install/postinstall script before adding
# it here -- see README.md's "Supply chain" section):
allowBuilds:
  '@swc/core': true
  esbuild: true

# Forces the transitive `uuid` dependency (pulled in by vite-plugin-top-level-await, build-time
# only, never shipped in the extension itself) up to a patched version -- GHSA-w5hq-g745-h8pq,
# a missing bounds check when a caller supplies its own output buffer. Scoped to this one
# package via an override rather than up/downgrading vite-plugin-top-level-await itself, which
# this project's wasm build pipeline is deliberately pinned to (see README "Building").
overrides:
  uuid: ^11.1.1
  # @tari-project/ootle (0.1.0, frozen since 2026-06-01) pins its own internal ootle-wasm
  # dependency to ^0.32.0 -- pnpm resolves that strictly to its own nested copy, separate from
  # the ^0.37.0 this project requires directly. Confirmed (diffing the two installed .d.ts files)
  # that createStealthOutputWitness's internal JSON wrapper key renamed spend_condition -> auth
  # between those versions, with the same JS function signature either way -- so StealthTransfer/
  # WalletStealthAuthorizer (which call this via WasmStealthCrypto) were silently building stealth
  # outputs in the stale pre-rename shape. This forces a single, current copy everywhere.
  '@tari-project/ootle-wasm': ^0.37.0
  # @tari-project/ootle@0.1.0 also omits `covenant_claims` from the stealth-transfer statement
  # it signs -- a field the current protocol's wire struct requires, causing shield/unshield to
  # fail server-side with "did not match any variant of untagged enum TransactionInput" (see
  # vendor/ootle-patched/README.md and tari-project/ootle.ts#117 for the full story). Points at
  # a locally-built, one-line-patched copy until upstream ships a real fix -- remove this
  # override and the vendor/ directory once that lands.
  '@tari-project/ootle': 'file:./vendor/ootle-patched'
  # @tari-project/ootle-secret-key-wallet@0.1.0's OWN build config (vite.config.js) forgot to
  # externalize @tari-project/ootle-wasm (unlike @tari-project/ootle's config, which correctly
  # does) -- so its published bundle inlines the entire wasm module directly (confirmed: ~1.5MB
  # bundle containing its own WebAssembly.instantiate calls), producing a SECOND, fully separate
  # WebAssembly.Instance from the SAME wasm binary whenever this package is used alongside
  # @tari-project/ootle (i.e. always, in any real wallet). Each instance has isolated linear
  # memory -- this was the actual root cause of the intermittent "did not match any variant of
  # untagged enum TransactionInput" failure signing stealth transfers specifically. See
  # vendor/ootle-secret-key-wallet-patched/README.md and tari-project/ootle.ts#117.
  '@tari-project/ootle-secret-key-wallet': 'file:./vendor/ootle-secret-key-wallet-patched'
