# pnpm blocks every dependency's install-time (preinstall/install/postinstall) scripts by
# default -- the single most common real-world npm supply-chain attack vector, since a
# compromised package's postinstall script runs with full filesystem/network access at install
# time, no different from running arbitrary code. Everything not listed here stays blocked.
#
# Only two dependencies in this project legitimately need one, both to download the correct
# platform-specific native binary for a well-known build tool (verified by inspecting every
# installed package's own package.json for a preinstall/install/postinstall script before adding
# it here -- see README.md's "Supply chain" section):
allowBuilds:
  '@swc/core': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@tari-project/indexer-client@1.6.0'
  - '@tari-project/ootle-indexer@0.3.0'
  - '@tari-project/ootle-secret-key-wallet@0.3.0'
  - '@tari-project/ootle-ts-bindings@1.49.1'
  - '@tari-project/ootle-wallet-daemon-signer@0.3.0'
  - '@tari-project/ootle-wasm@0.39.1'
  - '@tari-project/wallet_jrpc_client@1.22.0'

# Forces the transitive `uuid` dependency (pulled in by vite-plugin-top-level-await, build-time
# only, never shipped in the extension itself) up to a patched version -- GHSA-w5hq-g745-h8pq,
# a missing bounds check when a caller supplies its own output buffer. Scoped to this one
# package via an override rather than up/downgrading vite-plugin-top-level-await itself, which
# this project's wasm build pipeline is deliberately pinned to (see README "Building").
overrides:
  uuid: ^11.1.1
  # @tari-project/ootle-wasm@0.39.1 is a real, officially published, pinned release (not a
  # moving branch HEAD like the vendor build this used to point at) -- confirmed it exports
  # buildScriptPathWitness/buildStealthInputsStatementFromInputs/buildStealthTransferStatement
  # (tari-project/tari-ootle#2426, #2431) and that a plain, non-stealth transaction still signs
  # correctly against it (see the regression check this override's removal shipped with). No
  # override needed -- package.json's own `^0.39.1` requirement resolves this directly; listed
  # here only as a historical marker of what used to need forcing. Remove once confirmed stable.
  #
  # @tari-project/ootle@0.3.0 still hardcodes `"covenant_claims":[]` in its bundled
  # `StealthTransferStatement.toCompactJson()` (confirmed by grepping the published dist) --
  # correct for every transfer this wallet builds today (none spend a `Covenant`-gated input;
  # the HTLC leaves this wallet uses are HashLock/AfterEpoch/AccessRule, never read by
  # `covenant_balanced` -- see tari-project/tari-ootle#2431's review), but still not upstream-
  # fixed. Points at a locally-built, patched copy rebased on current `ootle.ts` -- remove this
  # override and the vendor/ directory once upstream ships a real fix.
  '@tari-project/ootle': 'file:./vendor/ootle-patched'
  # @tari-project/ootle-secret-key-wallet@0.3.0 now correctly externalizes @tari-project/ootle-wasm
  # (confirmed: its dist/index.js dropped from ~1.5MB with inlined WebAssembly.instantiate calls to
  # ~4KB) -- the dual-WASM-instance bug this override worked around is fixed upstream. No override
  # needed -- package.json's own `^0.3.0` requirement resolves this directly.
